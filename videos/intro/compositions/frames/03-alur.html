        [["#f03-node-1", 0.35], ["#f03-node-2", 0.70], ["#f03-node-3", 1.05]].forEach(([sel, at]) => {
          tl.fromTo(sel, { scale: 0.9, opacity: 0, y: 26 },
            { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, at);
        });

        // connectors draw between nodes, then the arrowheads land
        [["#f03-line-1", "#f03-arrow-1", 0.62], ["#f03-line-2", "#f03-arrow-2", 0.97]].forEach(([lineSel, arrowSel, at]) => {
          const line = document.querySelector(lineSel);
          const len = line.getTotalLength();
          tl.fromTo(line, { strokeDasharray: len, strokeDashoffset: len },
            { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, at);
          tl.fromTo(arrowSel, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.24, ease: "power2.out" }, at + 0.34);

        // scan sweep across the model node, then everything settles

        // footnote + privacy note

        // ambient: nodes breathe out of phase so the frame stays alive through the hold

          tl.to(sel, { y: -6, duration: 1.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.4 + off);
