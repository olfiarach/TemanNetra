      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = "svgOrigin";

        // ── Logo choreography (from frontend/motion/motion_spec.md, 1300 ms) ──
        const out3 = "power3.out", in3 = "power3.in", inout = "power2.inOut", back = "back.out(1.9)";

        // glows bloom behind the mark first
        tl.fromTo("#f01-glow-teal", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.6, ease: "power2.out" }, 0)
          .fromTo("#f01-glow-orange", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.8, ease: "power2.out" }, 0.2);

        // 0.00–0.14 card at 86 %, fading in
        tl.fromTo("#f01-card", { scale: 0.86, opacity: 0, [S]: "64 64" },
          { scale: 0.86, opacity: 1, duration: 0.14, ease: "linear", [S]: "64 64" }, 0)
        // 0.14–0.30 anticipation dip to 82 %
          .to("#f01-card", { scale: 0.82, duration: 0.15, ease: in3, [S]: "64 64" }, 0.14)
        // 0.30–0.56 back-out arrival at 100 %
          .to("#f01-card", { scale: 1, duration: 0.26, ease: back, [S]: "64 64" }, 0.30)
        // 0.36–0.58 note pops 30 % → 100 %
          .fromTo("#f01-note", { scale: 0.3, opacity: 0, [S]: "64 56" },
            { scale: 1, opacity: 1, duration: 0.22, ease: out3, [S]: "64 56" }, 0.36)
        // 0.50–0.745 lens overshoots to 116 %, settles
          .fromTo("#f01-coin", { scale: 0.2, opacity: 0, [S]: "64 56" },
            { scale: 1.16, opacity: 1, duration: 0.14, ease: out3, [S]: "64 56" }, 0.50)
          .to("#f01-coin", { scale: 1, duration: 0.105, ease: inout, [S]: "64 56" }, 0.64)
        // 0.59–0.72 pupil trails the lens
          .fromTo("#f01-pupil", { scale: 0, opacity: 0, [S]: "64 56" },
            { scale: 1.12, opacity: 1, duration: 0.10, ease: out3, [S]: "64 56" }, 0.59)
          .to("#f01-pupil", { scale: 1, duration: 0.08, ease: inout, [S]: "64 56" }, 0.70);

        // 0.62 / 0.70 / 0.78 rays drawn outward, staggered 80 ms
        ["#f01-ray-c", "#f01-ray-r", "#f01-ray-l"].forEach((sel, i) => {
          tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.17, ease: inout }, 0.62 + i * 0.08);
        });
        // 0.83 / 0.90 / 0.97 denomination lines drawn left→right, staggered 70 ms
        ["#f01-line-1", "#f01-line-2", "#f01-line-3"].forEach((sel, i) => {
          tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.16, ease: inout }, 0.83 + i * 0.07);
        });
        // 1.02–1.26 glint pulses to 130 %, settles
        tl.fromTo("#f01-glint", { scale: 1, opacity: 0.9, [S]: "56 49" },
          { scale: 1.3, opacity: 1, duration: 0.12, ease: out3, [S]: "56 49" }, 1.02)
          .to("#f01-glint", { scale: 1, opacity: 0.9, duration: 0.12, ease: inout, [S]: "56 49" }, 1.15);

        // 1.30–2.10 lockup text follows the mark
        tl.fromTo("#f01-wordmark", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: out3 }, 1.32)
          .fromTo("#f01-tagline", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: out3 }, 1.52)
          .fromTo("#f01-meta", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 1.9);

        // ── ambient life across the hold (bounded, deterministic) ──
        const breathe = { p: 0 };
        tl.to(breathe, {
          p: Math.PI * 2, duration: 2.4, ease: "none",
          onUpdate: () => {
            const s = Math.sin(breathe.p);
            const gl = document.getElementById("f01-glow-teal");
            const go = document.getElementById("f01-glow-orange");
            gl.style.transform = `scale(${1 + s * 0.02})`;
            go.style.transform = `scale(${1 - s * 0.02})`;
          }
        }, 1.5);
        tl.fromTo("#f01-glint", { opacity: 0.9 }, { opacity: 0.55, duration: 0.9, yoyo: true, repeat: 1, ease: "sine.inOut", overwrite: "auto", [S]: "56 49" }, 1.75);

        window.__timelines["f01-logo"] = tl;
      </script>
