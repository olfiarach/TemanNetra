      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const LEAD = 0.35; // starts after the colour-dip transition into this scene

        // glow blooms under the mark, mark settles in, then the URL wipes in
        tl.fromTo("#f06-glow", { opacity: 0, scale: 0.84 }, { opacity: 1, scale: 1, duration: 1.1, ease: "power2.out" }, LEAD)
          .fromTo("#f06-mark", { scale: 0, opacity: 0, y: -48 }, { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, LEAD + 0.05)
          .fromTo("#f06-url", { clipPath: "inset(0 100% 0 0)", opacity: 0 },

          .fromTo("#f06-status", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, LEAD + 1.45);

        // ambient: mark keeps a barely-perceptible settle; glow breathes once
        tl.fromTo("#f06-card", { scale: 1 }, { scale: 1.02, duration: 6, ease: "none" }, 0);
        const ph = { p: 0 };
        tl.to(ph, {
          p: Math.PI, duration: 2.6, ease: "none",
          onUpdate: () => {
            const g = document.getElementById("f06-glow");
            g.style.opacity = String(0.85 + Math.sin(ph.p) * 0.15);
          }
        }, LEAD + 1.1);
