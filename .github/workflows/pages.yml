# Static, browser-only build of the frontend (model runs client-side via onnxruntime-web).
# Model and speech assets in frontend/public/ come from `python backend/export_web.py`.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, revamp/improvement]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: test -s frontend/dist/model/best.onnx  # fail rather than deploy a page with no model
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
